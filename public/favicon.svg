<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Monogram: edit the letter to your initial. Colors follow the browser's light/dark theme. -->
  <style>
    .tile { fill: #18181b; }
    .letter { fill: #fafafa; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #fafafa; }
      .letter { fill: #0a0a0a; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7" />
  <text
    class="letter"
    x="16"
    y="16"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="600"
  >Y</text>
</svg>
